version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/t3mt.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: t3mt-service
build:
  run_buildscript: false
images:
  - id: t3mt-service
    target: service
    service: t3mt-service
    source: 85423296/t3mt
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    exclude_regex: '^(9\.9\.9|test)$'
    delivery:
      mode: mirror
stores:
  official:
    enabled: false
    skip_if_version_exists: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: T3MT
    summary: "Free media management assistant with automatic download support for Quark, Tencent, iQiyi, Mango TV, Youku and more"
